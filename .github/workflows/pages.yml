# Publishes the site/ folder to GitHub Pages on every push to main.
# In the repository: Settings > Pages > Source: "GitHub Actions".
#
# Two jobs on purpose: with upload and deploy in one job, deploy-pages sometimes found
# "0 artifacts" right after a successful upload (a GitHub timing race). A second job starts
# only once the upload is fully registered.
name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # let a running deploy finish; the next one follows

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Drop development-only files
        run: rm -rf site/dev
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
