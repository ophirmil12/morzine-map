<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Morzine Interactive Map</title>
<meta name="description" content="3D map of Morzine: ski runs, lifts and places to visit.">
<link rel="icon" type="image/svg+xml" href="assets/icons/alpine-skiing.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&icon_names=ac_unit,account_balance,activities,agriculture,aircraft,arrow_back,attractions,baby,bank,bar,bars,bed,bedroom_baby,biathlon,bocce_filled,bowling,bright_mind,cabin,cable_lift,carpet_ski_lift,chairlift,child_care,city_hall,classroom,climbing,content_cut,cottage,craft,cross_country_skiing,dentistry,directions_bike,directions_bus,directions_run,directions_walk,doctor,downhill_mtb,downhill_skiing,emoji_nature,farm,flight,food,forest,gondola,groups,hammer,handyman,health,helicopter,hiking,honey,hook,horse_riding,hospital,hotel,ice_skating,info,kayaking,lake,landscape,lease,legacy,legend_toggle,library,local_activity,local_bar,local_hospital,local_parking,local_pharmacy,local_pizza,local_police,local_post_office,local_taxi,location_on,lock,medical_services,mountain_bike,my_location,natural_reserve,navigation,nordic_ski_advanced,nordic_ski_easy,nordic_ski_intermediate,nordic_ski_novice,nordic_skiing,paintball,paragliding,parking,people,pharmacy,phishing,playground,police,pool,post_office,producers,protect,publictransport,rafting,real_estate_agent,recreational_activities,rental_accommodation,restaurant,restaurants,sailing,school,scissors,search,self_improvement,shield,shopping_bag,shops_and_services,ski_advanced,ski_easy,ski_intermediate,ski_novice,sledding,snowboarding,snowmobile,snowshoeing,spa,sports,sports_esports,sports_golf,sports_hockey,sports_tennis,stadium,stethoscope,store,storefront,sunny,surface_lift,taxi,theaters,toilet,tooth,tourism_office,trail_running,translate,usefull,water,waterfall,zoom_in_map&display=block">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map" aria-label=""></div>
<img class="map-logo" src="assets/logo.svg" alt="Morzine Portes du Soleil">

<!-- map buttons -->
<div class="map-tools" id="mapTools">
  <button class="tool" id="btn3d" type="button" aria-pressed="true"><span data-i18n="map.3d">3D</span></button>
  <button class="tool" id="btnNorth" type="button" data-i18n-title="map.north"><span class="ms" id="northIcon">navigation</span></button>
  <button class="tool" id="btnLocate" type="button" data-i18n-title="map.locate"><span class="ms">my_location</span></button>
  <button class="tool" id="btnLegend" type="button" data-i18n-title="map.legend"><span class="ms">legend_toggle</span></button>
</div>

<div class="legend" id="legend" hidden>
  <h3 data-i18n="legend.title"></h3>
  <ul>
    <li><i class="sw" style="--c:var(--piste-novice)"></i><span data-i18n="legend.novice"></span></li>
    <li><i class="sw" style="--c:var(--piste-easy)"></i><span data-i18n="legend.easy"></span></li>
    <li><i class="sw" style="--c:var(--piste-intermediate)"></i><span data-i18n="legend.intermediate"></span></li>
    <li><i class="sw" style="--c:var(--piste-advanced)"></i><span data-i18n="legend.advanced"></span></li>
    <li><i class="sw dashed" style="--c:var(--piste-easy)"></i><span data-i18n="legend.nordic"></span></li>
    <li><i class="sw dotted" style="--c:var(--route)"></i><span data-i18n="legend.route"></span></li>
    <li><i class="sw lift"></i><span data-i18n="legend.lift"></span></li>
  </ul>
</div>

<!-- side panel / bottom sheet -->
<aside class="panel" id="panel">
  <div class="grab" id="grab" aria-hidden="true"></div>
  <header class="panel-head">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.svg" alt="Morzine Portes du Soleil">
      <span class="brand-sub" data-i18n="brand.sub"></span>
    </div>
    <div class="head-ctrls">
      <div class="seg" id="seasonSeg" role="group" hidden>
        <button type="button" data-season="winter"><span class="ms">ac_unit</span><span data-i18n="season.winter"></span></button>
        <button type="button" data-season="summer"><span class="ms">sunny</span><span data-i18n="season.summer"></span></button>
      </div>
      <label class="lang">
        <span class="ms">translate</span>
        <select id="langSelect" data-i18n-aria="lang.choose"></select>
      </label>
    </div>
  </header>

  <!-- list view -->
  <section class="view" id="listView">
    <div class="search">
      <span class="ms">search</span>
      <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search.placeholder">
    </div>
    <div class="chips" id="chips" role="group"></div>
    <div class="count" id="count"></div>
    <ul class="results" id="results"></ul>
  </section>

  <!-- detail view -->
  <section class="view" id="detailView" hidden>
    <button class="back" id="back" type="button"><span class="ms">arrow_back</span><span data-i18n="detail.back"></span></button>
    <div class="detail-head">
      <span class="badge" id="dIcon"></span>
      <div>
        <h1 id="dName"></h1>
        <p class="kind" id="dKind"></p>
      </div>
    </div>
    <p class="desc" id="dDesc"></p>
    <dl class="facts" id="dFacts"></dl>
    <button class="primary" id="dZoom" type="button"><span class="ms">zoom_in_map</span><span data-i18n="detail.showOnMap"></span></button>
  </section>

  <footer class="panel-foot">
    <span data-i18n="footer.office"></span> · <a href="tel:+33450747272">+33 (0)4 50 74 72 72</a>
  </footer>
</aside>

<div class="toast" id="toast" role="status" hidden></div>
<div class="offline" id="offline" role="status" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="js/basemap.js"></script>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
